# Groups the release notes that `gh release create --generate-notes` writes for each
# aireg release. Each pull request goes under the first category its labels match,
# and the labels come from labeler.yml.

changelog:
  exclude:
    labels:
      - area:ci
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: aireg CLI
      labels: [area:cli]
    - title: File spec
      labels: [area:spec]
    - title: Examples
      labels: [area:examples]
    - title: Spec checks
      labels: [area:tools]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
