<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" width="720" height="268" role="img" aria-label="You release a new version of a skill to your registry, a private GitHub repository that keeps every version. Claude Code, Codex, Cursor and your other laptop pick it up within 15 minutes.">
<rect width="720" height="268" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A8583"/></marker></defs>
<text x="30" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#17201F" text-anchor="start">Your skills, in every tool and on every machine</text>
<text x="30" y="45" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4A5654" text-anchor="start">Release a version once, and every coding agent on every machine you use picks it up.</text>
<text x="30" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#7A8583" text-anchor="start">YOU</text>
<text x="510" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#7A8583" text-anchor="start">WHERE IT IS USED</text>
<rect x="30" y="124" width="180" height="34" rx="5" fill="#FFFFFF" stroke="#B9C2BF" stroke-width="1"/>
<text x="120" y="141" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#17201F" text-anchor="middle" dominant-baseline="central">release a new version</text>
<line x1="210" y1="141" x2="268" y2="141" stroke="#7A8583" stroke-width="0.9" marker-end="url(#arrow)"/>
<rect x="270" y="80" width="180" height="122" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="360" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="middle">your registry</text>
<text x="360" y="117" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#085041" text-anchor="middle">a private GitHub repository</text>
<rect x="280" y="132" width="160" height="24" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text x="360" y="144" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#085041" text-anchor="middle" dominant-baseline="central">every version kept</text>
<rect x="280" y="164" width="160" height="24" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text x="360" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#085041" text-anchor="middle" dominant-baseline="central">go back any time</text>
<line x1="450" y1="97" x2="508" y2="97" stroke="#7A8583" stroke-width="0.9" marker-end="url(#arrow)"/>
<rect x="510" y="80" width="180" height="34" rx="5" fill="#FFFFFF" stroke="#B9C2BF" stroke-width="1"/>
<text x="600" y="97" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#17201F" text-anchor="middle" dominant-baseline="central">Claude Code</text>
<line x1="450" y1="141" x2="508" y2="141" stroke="#7A8583" stroke-width="0.9" marker-end="url(#arrow)"/>
<rect x="510" y="124" width="180" height="34" rx="5" fill="#FFFFFF" stroke="#B9C2BF" stroke-width="1"/>
<text x="600" y="141" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#17201F" text-anchor="middle" dominant-baseline="central">Codex and Cursor</text>
<line x1="450" y1="185" x2="508" y2="185" stroke="#7A8583" stroke-width="0.9" marker-end="url(#arrow)"/>
<rect x="510" y="168" width="180" height="34" rx="5" fill="#FFFFFF" stroke="#B9C2BF" stroke-width="1"/>
<text x="600" y="185" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#17201F" text-anchor="middle" dominant-baseline="central">your other laptop</text>
<text x="240" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#7A8583" text-anchor="middle">publish</text>
<text x="480" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#7A8583" text-anchor="middle">within 15 minutes</text>
<text x="30" y="254" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#7A8583" text-anchor="start">Teal: your registry. One release reaches every coding agent on this laptop and your other machines.</text>
</svg>
