site_name: ai-registry
site_description: An open specification for how agent artifacts are stored, versioned, verified, and served.
site_url: !ENV [DOCS_SITE_URL, "https://atlanai.github.io/ai-registry/"]
repo_url: https://github.com/atlanai/ai-registry
repo_name: atlanai/ai-registry
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

# The theme overrides and the build requirements live in docs/ but are not pages.
exclude_docs: |
  /overrides/
  /requirements.in
  /requirements.txt

# The command pages are reached from the CLI reference page, so only it is in the nav.
not_in_nav: |
  /reference/*.md

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  font: false
  palette:
    scheme: default
    primary: black
    accent: teal
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Overview: index.md
  - "What is an agent registry?": what-is-an-agent-registry.md
  - Architecture: architecture.md
  - Use cases:
      - Teams and organisations: use-cases/teams.md
      - Individuals: use-cases/individuals.md
  - Get started:
      - Quickstart: quickstart.md
      - "Example: acme-registry": example.md
  - Reference:
      - CLI reference: reference/index.md
  - Design:
      - "MCP servers (draft)": design/mcp-servers.md
