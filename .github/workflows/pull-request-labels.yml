name: Pull request labels

# Labels a pull request by the paths it changes, keeps `breaking` in step with a
# `!` in its title, and fails until it has an area label. The labels group the
# release notes. A maintainer can add a label by hand; that reruns the check.
#
# pull_request_target, so it can label pull requests from forks. It never checks
# out the pull request: labeler reads the changed paths from the API, and the
# title is only matched against a pattern.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  labels:
    name: Pull request labels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number };
            // `breaking` follows the title's `!`, both ways, so an edited title doesn't leave it stale.
            const breaking = /^[a-z]+(\([^)]*\))?!: /.test(pr.title);
            const labelled = pr.labels.some((label) => label.name === "breaking");
            if (breaking && !labelled) await github.rest.issues.addLabels({ ...issue, labels: ["breaking"] });
            if (!breaking && labelled) await github.rest.issues.removeLabel({ ...issue, name: "breaking" });
            const { data } = await github.rest.issues.listLabelsOnIssue(issue);
            const areas = ["area:cli", "area:spec", "area:examples", "area:tools", "area:ci", "documentation"];
            if (!data.some((label) => areas.includes(label.name))) {
              core.setFailed(
                `No path matched an area label, so a maintainer needs to add one of: ${areas.join(", ")}. ` +
                  "The labels group the release notes; see the Pull requests section of CONTRIBUTING.md.",
              );
            }
