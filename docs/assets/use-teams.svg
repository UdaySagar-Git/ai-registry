<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" width="720" height="268" role="img" aria-label="Teams publish skills from their own app repositories on merge into one team registry, a git repository where every change is reviewed and every version is kept. Projects pin exact versions, CI uses the pinned versions, and laptops stay current.">
<rect width="720" height="268" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A8583"/></marker></defs>
<text x="30" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#17201F" text-anchor="start">One registry for the whole company</text>
<text x="30" y="45" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4A5654" text-anchor="start">Teams publish from their own repositories, every change is reviewed, and everyone installs exact versions.</text>
<text x="30" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#7A8583" text-anchor="start">TEAMS&#x27; REPOSITORIES</text>
<text x="510" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#7A8583" text-anchor="start">WHERE IT IS USED</text>
<rect x="30" y="80" width="180" height="34" rx="5" fill="#FFFFFF" stroke="#B9C2BF" stroke-width="1"/>
<text x="120" y="97" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#17201F" text-anchor="middle" dominant-baseline="central">payments app repo</text>
<line x1="210" y1="97" x2="268" y2="97" stroke="#7A8583" stroke-width="0.9" marker-end="url(#arrow)"/>
<rect x="30" y="124" width="180" height="34" rx="5" fill="#FFFFFF" stroke="#B9C2BF" stroke-width="1"/>
<text x="120" y="141" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#17201F" text-anchor="middle" dominant-baseline="central">data app repo</text>
<line x1="210" y1="141" x2="268" y2="141" stroke="#7A8583" stroke-width="0.9" marker-end="url(#arrow)"/>
<rect x="30" y="168" width="180" height="34" rx="5" fill="#FFFFFF" stroke="#B9C2BF" stroke-width="1"/>
<text x="120" y="185" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#17201F" text-anchor="middle" dominant-baseline="central">platform app repo</text>
<line x1="210" y1="185" x2="268" y2="185" stroke="#7A8583" stroke-width="0.9" marker-end="url(#arrow)"/>
<rect x="270" y="80" width="180" height="122" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="360" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="middle">team registry</text>
<text x="360" y="117" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#085041" text-anchor="middle">a git repository</text>
<rect x="280" y="132" width="160" height="24" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text x="360" y="144" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#085041" text-anchor="middle" dominant-baseline="central">reviewed changes</text>
<rect x="280" y="164" width="160" height="24" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text x="360" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#085041" text-anchor="middle" dominant-baseline="central">every version kept</text>
<line x1="450" y1="97" x2="508" y2="97" stroke="#7A8583" stroke-width="0.9" marker-end="url(#arrow)"/>
<rect x="510" y="80" width="180" height="34" rx="5" fill="#FFFFFF" stroke="#B9C2BF" stroke-width="1"/>
<text x="600" y="97" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#17201F" text-anchor="middle" dominant-baseline="central">projects pin versions</text>
<line x1="450" y1="141" x2="508" y2="141" stroke="#7A8583" stroke-width="0.9" marker-end="url(#arrow)"/>
<rect x="510" y="124" width="180" height="34" rx="5" fill="#FFFFFF" stroke="#B9C2BF" stroke-width="1"/>
<text x="600" y="141" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#17201F" text-anchor="middle" dominant-baseline="central">CI uses pinned versions</text>
<line x1="450" y1="185" x2="508" y2="185" stroke="#7A8583" stroke-width="0.9" marker-end="url(#arrow)"/>
<rect x="510" y="168" width="180" height="34" rx="5" fill="#FFFFFF" stroke="#B9C2BF" stroke-width="1"/>
<text x="600" y="185" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#17201F" text-anchor="middle" dominant-baseline="central">laptops stay current</text>
<text x="240" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#7A8583" text-anchor="middle">publish on merge</text>
<text x="480" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#7A8583" text-anchor="middle">install and keep in sync</text>
<text x="30" y="254" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#7A8583" text-anchor="start">Teal: the team registry. A change is reviewed once, then reaches every project and laptop that uses it.</text>
</svg>
