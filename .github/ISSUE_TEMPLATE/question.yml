name: Question
description: Ask how to use aireg, how to build a registry or what the file spec means.
labels: ["question", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        The [Quickstart](https://atlanai.github.io/ai-registry/quickstart/), the [use cases](https://atlanai.github.io/ai-registry/use-cases/teams/) and the [file spec](https://github.com/atlanai/ai-registry/blob/main/spec/file-spec.md) answer the most common questions. If something there is wrong or unclear, a bug report helps the next reader too.

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you want to know, and what you're trying to do. The goal helps us suggest a better route.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What you've tried
      description: The pages you read, the commands you ran and what they printed.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - aireg (the CLI)
        - File spec or schemas
        - Building or hosting a registry
        - Documentation site
        - Example registries
        - Not sure

  - type: input
    id: version
    attributes:
      label: aireg version
      description: The output of `aireg --version`, if the question is about the CLI.
      placeholder: "0.1.0"

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the documentation and existing issues.
          required: true
