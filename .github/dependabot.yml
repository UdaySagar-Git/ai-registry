# GitHub Actions are updated by Renovate (renovate.json), which keeps them pinned to digests.
version: 2
updates:
  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: weekly
    # Match pnpm's minimum release age for routine version updates.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # The hash-locked docs and schema-check toolchains.
  - package-ecosystem: pip
    directories: [/docs, /tools]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
