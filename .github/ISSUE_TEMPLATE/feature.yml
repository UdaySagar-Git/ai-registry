name: Feature request
description: Suggest something new for aireg, the file spec, the docs or the example registries.
labels: ["enhancement", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please [search existing issues](https://github.com/atlanai/ai-registry/issues?q=is%3Aissue) first.

        Support for another coding agent and small fixes can go straight to a pull request. New commands, flags and config keys need an issue first, since aireg has to keep each one working. For a change to the file spec, choose **File spec or schemas** below and fill in the effect on existing registries.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - aireg (the CLI)
        - Support for another coding agent
        - File spec or schemas
        - Documentation site
        - Example registries
        - Spec checks (tools/)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do and what gets in the way today. Describe the problem before the solution, so we can weigh other ways to solve it.
      placeholder: When I publish a skill to two registries, I have to...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it would work. For aireg, show the command and the output you'd expect. For the spec, show the file or field and an example.
      placeholder: |
        $ aireg <the command or flag you'd add>
        <what it would print>
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Other approaches you considered, and what you do today instead.

  - type: textarea
    id: compatibility
    attributes:
      label: Effect on existing registries and clients
      description: Does this change the files a registry holds, a manifest or lockfile, or how an existing client reads them? Required for spec changes. Say "none" if nothing existing changes.

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      description: If yes, wait for a maintainer to agree the direction before you start.
      options:
        - "Yes"
        - Yes, with some guidance
        - "No"

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and didn't find this request.
          required: true
